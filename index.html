<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mermaid</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <a class="brand" href="./" aria-label="Mermaid home">MERMAID</a>
        <div class="actions">
          <button id="theme" aria-label="Switch to dark theme">LIGHT</button>
          <button id="new" title="Clear source">CLEAR</button>
          <button id="export" aria-label="Export SVG" disabled>SVG</button>
          <button id="toggle" aria-label="Toggle source" aria-controls="editor" aria-expanded="true" aria-keyshortcuts="Meta+Enter Control+Enter"><span id="toggle-label">VIEW</span></button>
        </div>
      </header>
      <main id="workspace" class="workspace editing empty">
        <aside id="editor" class="editor">
          <label class="panel-heading" for="source"><span class="paste-label">Paste Mermaid syntax.</span><span class="source-label">SOURCE</span></label>
          <div class="source-box">
            <div class="editor-body"><div id="line-numbers" aria-hidden="true">1</div><textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Mermaid diagram source" placeholder="flowchart LR&#10;  A --> B"></textarea></div>
            <div id="error" class="error" role="status" hidden></div>
            <div class="editor-meta"><span id="line-count">1 line</span><span>⌘ / Ctrl + Enter</span></div>
          </div>
          <div id="empty-state" class="examples"><span>Examples:</span><button data-example="flowchart">Flowchart</button><button data-example="sequence">Sequence</button><button data-example="mindmap">Mind map</button></div>
        </aside>
        <section class="canvas" aria-label="Diagram preview">
          <div id="diagram" tabindex="0" aria-label="Rendered diagram" hidden></div>
          <div id="preview-error" class="preview-error" role="status" hidden></div>
        </section>
      </main>
      <span id="status" class="sr-only" role="status">Paste Mermaid syntax.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
